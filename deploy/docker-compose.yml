services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../api
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8001:80"
    environment:
      MONGODB_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/?authSource=admin
      REDIS_URI: redis://:${REDIS_PASSWORD}@redis:6379/0
      APP_NAME: ${APP_NAME:-TapNSwitch}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-admin}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@local.dev}
      CHECKFRONT_WEBHOOK_SECRET: ${CHECKFRONT_WEBHOOK_SECRET:-}
      CHECKFRONT_API_URL: ${CHECKFRONT_API_URL:-}
      CHECKFRONT_API_KEY: ${CHECKFRONT_API_KEY:-}
      CHECKFRONT_API_SECRET: ${CHECKFRONT_API_SECRET:-}
      CHECKFRONT_SYNC_INTERVAL_SECONDS: ${CHECKFRONT_SYNC_INTERVAL_SECONDS:-0}
      CHECKFRONT_GROUP_MODE: ${CHECKFRONT_GROUP_MODE:-session}
      CHECKFRONT_PLAYER_FIELD_KEYS: ${CHECKFRONT_PLAYER_FIELD_KEYS:-}
      CHECKFRONT_ACCEPT_STATUSES: ${CHECKFRONT_ACCEPT_STATUSES:-PAID,CONF,PEND,HOLD,WAIT}
      VENUE_TIMEZONE: ${VENUE_TIMEZONE:-America/New_York}
      VENUE_ARENAS: ${VENUE_ARENAS:-}

  frontend:
    build:
      context: ../app
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8000:80"
    environment:
      API_URL: ${API_URL:-http://localhost:8001}

volumes:
  mongo_data:
  redis_data:
