name: Publish Docker Container

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag ghcr.io/${{ github.repository_owner }}/tapnswitch:latest --tag ghcr.io/${{ github.repository_owner }}/tapnswitch:${{ github.sha }}

    - name: Push the Docker image
      if: github.event_name == 'push'
      run: |
        docker push ghcr.io/${{ github.repository_owner }}/tapnswitch:latest
        docker push ghcr.io/${{ github.repository_owner }}/tapnswitch:${{ github.sha }}
